<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Studio | Fresher Fiascos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#031E36;
    --navy-2:#0B3358;
    --navy-soft:#0B335822;
    --gold:#F8A910;
    --gold-2:#FFC85C;
    --cream:#FEF8F3;
    --studio-bg:#EAE6DE;
    --panel:#FFFFFF;
    --line:#E4DED2;
    --ink:#22262b;
    --ink-soft:#6b7178;
    --radius:10px;
    --shadow:0 6px 18px rgba(3,30,54,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--studio-bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;}
  select,input{font-family:inherit;}

  /* ===== HEADER ===== */
  #appHeader{
    height:58px;flex:0 0 58px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
    box-shadow:var(--shadow);
    z-index:50;
  }
  #appHeader .brand{
    display:flex;align-items:center;gap:10px;color:#fff;
  }
  #appHeader .brand .header-icon{height:32px;width:auto;max-width:120px;border-radius:6px;object-fit:contain;display:block;}
  #appHeader .brand b{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:.2px;font-size:16px;}
  #appHeader .brand span{font-size:12px;color:#c9d4de;font-weight:400;}
  #headerActions{display:flex;align-items:center;gap:10px;}
  .zoom-group{display:flex;align-items:center;gap:4px;background:#0B335880;border-radius:8px;padding:4px;}
  .zoom-group button{width:26px;height:26px;border:none;background:transparent;color:#fff;border-radius:6px;font-size:15px;font-weight:600;}
  .zoom-group button:hover{background:#ffffff22;}
  .zoom-group span{color:#e7edf2;font-size:12px;width:42px;text-align:center;}
  #downloadBtn{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:var(--navy);border:none;padding:10px 18px;border-radius:9px;
    font-weight:700;font-size:13.5px;letter-spacing:.2px;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    transition:transform .12s ease;
  }
  #downloadBtn:hover{transform:translateY(-1px);}
  #downloadBtn:active{transform:translateY(0px);}

  /* ===== RIBBON ===== */
  #ribbon{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);z-index:40;}
  #ribbonTabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);}
  .ribbon-tab{
    background:none;border:none;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);
    border-radius:8px 8px 0 0;position:relative;top:1px;
  }
  .ribbon-tab.active{color:var(--navy);background:var(--cream);border:1px solid var(--line);border-bottom:1px solid var(--cream);}
  #ribbonBody{
    padding:10px 14px;display:flex;align-items:flex-end;gap:16px;
    overflow-x:auto;min-height:66px;
  }
  .ribbon-panel{display:none;align-items:flex-end;gap:16px;}
  .ribbon-panel.active{display:flex;}
  .rgroup{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:max-content;}
  .rgroup .rlabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600;padding-left:2px;}
  .rrow{display:flex;gap:5px;align-items:center;}
  .rdiv{width:1px;align-self:stretch;background:var(--line);margin:0 4px;}
  .rbtn{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:#fff;
    color:var(--navy);font-size:14px;
  }
  .rbtn:hover{background:var(--cream);border-color:var(--line);}
  .rbtn.active{background:var(--navy);color:#fff;}
  .rbtn.wide{width:auto;padding:0 10px;gap:6px;font-size:12.5px;font-weight:600;}
  .rselect{
    height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
    padding:0 8px;font-size:12.5px;
  }
  .swatch-btn{
    width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  }
  .swatch-btn .swatch-bar{width:18px;height:4px;border-radius:2px;background:var(--gold);}
  .swatch-btn .swatch-letter{font-weight:800;font-size:13px;line-height:1;color:var(--ink);}

  /* palette popover */
  .popover{
    position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow);padding:12px;z-index:200;width:196px;
  }
  .popover .plabel{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:700;margin:6px 0 6px;}
  .popover .plabel:first-child{margin-top:0;}
  .swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .swatch{width:26px;height:26px;border-radius:6px;border:1px solid #00000018;position:relative;}
  .swatch:hover{outline:2px solid var(--navy);outline-offset:1px;}
  .popover .custom-row{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;}
  .popover input[type=color]{width:30px;height:30px;border:none;padding:0;background:none;border-radius:6px;cursor:pointer;}
  .popover .custom-row span{font-size:11.5px;color:var(--ink-soft);}
  .field-wrap{position:relative;}

  /* ===== MAIN AREA ===== */
  #main{flex:1 1 auto;display:flex;overflow:hidden;}
  #stageViewport{
    flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;
    background:
      radial-gradient(circle at 1px 1px, #d9d3c6 1px, transparent 1px);
    background-size:22px 22px;
    position:relative;
    overscroll-behavior:contain;
  }
  #stageScaler{transform-origin:top left;position:relative;}
  #stage{
    width:1080px;height:1080px;position:relative;background:var(--cream);
    box-shadow:0 20px 50px rgba(3,30,54,.28);overflow:hidden;
    border-radius:2px;
  }
  #chromeLayer{position:absolute;inset:0;pointer-events:none;z-index:1;}
  #contentLayer{position:absolute;inset:0;z-index:2;}
  #emptyHint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;color:#031e3655;font-family:'Poppins',sans-serif;font-weight:600;font-size:22px;
    pointer-events:none;z-index:2;line-height:1.5;
  }
  #emptyHint small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:#031e3640;margin-top:6px;}

  /* ===== ELEMENTS ===== */
  .el{position:absolute;touch-action:none;}
  .el.el-text{min-width:24px;min-height:24px;}
  .el-content{width:100%;height:100%;outline:none;}
  .el.el-text .el-content{
    padding:6px 8px;font-family:'Poppins',sans-serif;font-weight:700;font-size:36px;color:var(--navy);
    line-height:1.25;cursor:move;
  }
  .el.el-text.editing .el-content{cursor:text;}
  .el:hover:not(.selected) > .el-content{outline:1.5px dashed #f8a91099;outline-offset:2px;}
  .el.selected > .el-content{outline:1.5px solid var(--gold);outline-offset:2px;}
  .el img{width:100%;height:100%;object-fit:contain;display:block;cursor:move;pointer-events:none;user-select:none;}
  .el.el-image.selected img,.el.el-image:hover img{outline:1.5px solid var(--gold);outline-offset:2px;}

  .el.el-line .el-content{width:100%;height:100%;display:flex;align-items:center;cursor:move;}
  .el.el-line .line-visual{width:100%;}

  .el.el-shape .el-content{width:100%;height:100%;cursor:move;}

  .el.el-table .table-wrap{width:100%;height:100%;display:flex;flex-direction:column;}
  .table-drag{
    height:16px;background:var(--navy);border-radius:5px 5px 0 0;cursor:move;
    display:flex;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;touch-action:none;
  }
  .table-drag .dotgrip{width:2px;height:2px;background:#ffffffaa;border-radius:50%;}
  .el.el-table table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed;flex:1;background:#fff;}
  .el.el-table td{
    border:1px solid #031e3630;padding:8px 10px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
    outline:none;vertical-align:middle;overflow:hidden;
  }
  .el.el-table tr.hdr td{background:var(--navy);color:#fff;font-weight:700;}
  .el.el-table tr:nth-child(even):not(.hdr) td{background:#031e3608;}

  /* handles */
  .handle{
    position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--navy);border-radius:3px;
    z-index:5;display:none;touch-action:none;
  }
  .el.selected .handle{display:block;}
  .h-nw{left:-7px;top:-7px;cursor:nwse-resize;}
  .h-ne{right:-7px;top:-7px;cursor:nesw-resize;}
  .h-sw{left:-7px;bottom:-7px;cursor:nesw-resize;}
  .h-se{right:-7px;bottom:-7px;cursor:nwse-resize;}
  .h-n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize;}
  .h-s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize;}
  .h-e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize;}
  .h-w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize;}
  .rotate-handle{
    position:absolute;left:50%;top:-34px;margin-left:-8px;width:16px;height:16px;border-radius:50%;
    background:var(--gold);border:2px solid var(--navy);z-index:5;display:none;cursor:grab;touch-action:none;
  }
  .rotate-handle::after{
    content:'';position:absolute;left:50%;top:16px;width:2px;height:14px;background:var(--navy);margin-left:-1px;
  }
  .el.selected .rotate-handle{display:block;}
  .del-btn{
    position:absolute;right:-11px;top:-30px;width:20px;height:20px;border-radius:50%;background:#e0304b;
    color:#fff;border:2px solid #fff;font-size:12px;line-height:1;display:none;align-items:center;justify-content:center;
    z-index:6;box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .el.selected .del-btn{display:flex;}

  .exporting .el.selected > .el-content,.exporting .el.selected img{outline:none !important;}
  .exporting .handle,.exporting .rotate-handle,.exporting .del-btn,.exporting .table-drag{display:none !important;}
  .exporting #emptyHint{display:none !important;}

  /* floating toolbar */
  #floatToolbar{
    position:absolute;display:none;background:var(--navy);border-radius:9px;padding:5px;gap:4px;
    box-shadow:var(--shadow);z-index:100;align-items:center;
  }
  #floatToolbar button{
    width:28px;height:28px;border:none;background:transparent;color:#fff;border-radius:6px;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  #floatToolbar button:hover{background:#ffffff22;}
  #floatToolbar .ft-div{width:1px;height:18px;background:#ffffff33;margin:0 2px;}
  #floatToolbar select{height:26px;font-size:11px;border-radius:5px;border:none;padding:0 4px;}

  /* ===== TEMPLATE THUMBS ===== */
  .tmpl-thumb{
    width:118px;height:118px;border-radius:9px;overflow:hidden;position:relative;border:2px solid var(--line);
    background:var(--cream);flex:0 0 auto;
  }
  .tmpl-thumb.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--navy) inset;}
  .tmpl-thumb .mini-stage{width:1080px;height:1080px;transform:scale(0.1093);transform-origin:top left;position:relative;pointer-events:none;}
  .tmpl-card{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .tmpl-card span{font-size:11px;font-weight:600;color:var(--ink-soft);}

  .settings-note{font-size:11px;color:var(--ink-soft);max-width:280px;line-height:1.5;}

  /* modal */
  #modalOverlay{
    position:fixed;inset:0;background:rgba(3,30,54,.45);display:none;align-items:center;justify-content:center;z-index:500;
  }
  #modalOverlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:12px;padding:22px;width:280px;box-shadow:var(--shadow);}
  .modal-box h3{margin:0 0 14px;font-family:'Poppins',sans-serif;font-size:16px;color:var(--navy);}
  .modal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .modal-row label{font-size:13px;color:var(--ink-soft);}
  .modal-row input{width:70px;height:32px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:13px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;height:36px;border-radius:8px;border:none;font-weight:600;font-size:13px;}
  .modal-actions .cancel{background:var(--cream);color:var(--ink-soft);}
  .modal-actions .confirm{background:var(--navy);color:#fff;}

  #exportOverlay{
    position:fixed;inset:0;background:rgba(3,30,54,.55);display:none;align-items:center;justify-content:center;z-index:600;
    color:#fff;font-family:'Poppins',sans-serif;font-weight:600;flex-direction:column;gap:12px;
  }
  #exportOverlay.show{display:flex;}
  .spinner{width:34px;height:34px;border-radius:50%;border:4px solid #ffffff33;border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:#031e3633;border-radius:6px;}

  /* ===== RESPONSIVE ===== */
  @media (max-width:900px){
    #templateThumbs{flex-wrap:wrap;max-width:420px;}
  }
  @media (max-width:720px){
    #appHeader{padding:0 10px;height:52px;flex:0 0 52px;overflow-x:auto;overflow-y:hidden;}
    #appHeader .brand{gap:7px;flex:0 0 auto;}
    #appHeader .brand span{display:none;}
    #appHeader .brand b{font-size:13px;white-space:nowrap;}
    #appHeader .brand .header-icon{height:24px;}
    #headerActions{gap:6px;flex:0 0 auto;}
    #downloadBtn{padding:8px 10px;font-size:11px;gap:4px;white-space:nowrap;flex:0 0 auto;}
    .zoom-group{padding:3px;gap:2px;flex:0 0 auto;}
    .zoom-group span{width:34px;font-size:11px;}
    #ribbonTabs{padding:6px 8px 0;}
    .ribbon-tab{padding:7px 11px;font-size:12px;}
    #ribbonBody{padding:8px 10px;gap:10px;min-height:58px;}
    .rgroup .rlabel{font-size:8.5px;}
    .rbtn,.swatch-btn{width:28px;height:28px;}
    .rselect{height:28px;font-size:11.5px;}
    .tmpl-thumb{width:78px;height:78px;}
    .tmpl-thumb .mini-stage{transform:scale(0.0722);}
    .modal-box{width:88vw;max-width:280px;}
    .popover{width:180px;}
  }
  @media (max-width:480px){
    #appHeader .brand b{font-size:12px;}
    #downloadBtn{padding:7px 10px;font-size:11px;}
    .tmpl-thumb{width:68px;height:68px;}
    .tmpl-thumb .mini-stage{transform:scale(0.0630);}
  }
</style>
</head>
<body>

<div id="appHeader">
  <div class="brand">
    <img id="headerIcon" class="header-icon" alt="Fresher Fiascos">
    <div>
      <b>Template Studio</b><br><span>Fresher Fiascos · Instagram Post Editor</span>
    </div>
  </div>
  <div id="headerActions">
    <div class="zoom-group">
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
    </div>
    <button id="downloadBtn">⬇ Download High‑Res PNG</button>
  </div>
</div>

<div id="ribbon">
  <div id="ribbonTabs">
    <button class="ribbon-tab active" data-tab="home">Home</button>
    <button class="ribbon-tab" data-tab="insert">Insert</button>
    <button class="ribbon-tab" data-tab="design">Design</button>
  </div>
  <div id="ribbonBody">

    <!-- HOME TAB -->
    <div class="ribbon-panel active" id="panel-home">
      <div class="rgroup">
        <div class="rlabel">Font</div>
        <div class="rrow">
          <select class="rselect" id="fontFamily" style="width:130px;">
            <option value="Poppins">Poppins</option>
            <option value="Inter">Inter</option>
            <option value="Georgia">Georgia</option>
            <option value="Arial">Arial</option>
            <option value="'Courier New'">Courier New</option>
            <option value="'Times New Roman'">Times New Roman</option>
          </select>
          <select class="rselect" id="fontSize" style="width:64px;">
            <option>12</option><option>14</option><option>16</option><option>18</option>
            <option selected>20</option><option>24</option><option>28</option><option>32</option>
            <option selected>36</option><option>40</option><option>48</option><option>56</option>
            <option>64</option><option>72</option><option>96</option><option>120</option>
          </select>
        </div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Style</div>
        <div class="rrow">
          <button class="rbtn" id="btnBold" title="Bold"><b>B</b></button>
          <button class="rbtn" id="btnItalic" title="Italic"><i>I</i></button>
          <button class="rbtn" id="btnUnderline" title="Underline"><u>U</u></button>
          <button class="rbtn" id="btnStrike" title="Strikethrough"><s>S</s></button>
        </div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Color</div>
        <div class="rrow">
          <div class="field-wrap">
            <button class="swatch-btn" id="btnTextColor" title="Text Color">
              <span class="swatch-letter">A</span>
              <span class="swatch-bar" id="textColorBar"></span>
            </button>
          </div>
          <div class="field-wrap">
            <button class="swatch-btn" id="btnHighlight" title="Highlight">
              <span class="swatch-letter" style="font-size:12px;">✎</span>
              <span class="swatch-bar" id="highlightColorBar" style="background:#FFF176;"></span>
            </button>
          </div>
        </div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Align</div>
        <div class="rrow">
          <button class="rbtn" data-align="left" title="Align Left">⯇</button>
          <button class="rbtn" data-align="center" title="Align Center">☰</button>
          <button class="rbtn" data-align="right" title="Align Right">⯈</button>
        </div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">List</div>
        <div class="rrow">
          <button class="rbtn" id="btnUL" title="Bulleted List">•≡</button>
          <button class="rbtn" id="btnOL" title="Numbered List">1≡</button>
        </div>
      </div>
    </div>

    <!-- INSERT TAB -->
    <div class="ribbon-panel" id="panel-insert">
      <div class="rgroup">
        <div class="rlabel">Add</div>
        <div class="rrow">
          <button class="rbtn wide" id="btnAddText">🄰 Text Box</button>
          <button class="rbtn wide" id="btnAddImage">🖼 Image</button>
          <button class="rbtn wide" id="btnAddTable">▦ Table</button>
        </div>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Shapes</div>
        <div class="rrow">
          <button class="rbtn" id="shapeRect" title="Rectangle">▭</button>
          <button class="rbtn" id="shapeCircle" title="Circle">◯</button>
          <button class="rbtn" id="shapePill" title="Pill / Badge">⬭</button>
          <button class="rbtn" id="shapeStar" title="Star">★</button>
          <button class="rbtn" id="shapeTriangle" title="Triangle">▲</button>
          <button class="rbtn" id="shapeDiamond" title="Diamond">◆</button>
          <button class="rbtn" id="shapeHexagon" title="Hexagon">⬡</button>
          <button class="rbtn" id="shapeArrow" title="Arrow">➤</button>
          <button class="rbtn" id="shapeSpeech" title="Speech Bubble">💬</button>
        </div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Lines</div>
        <div class="rrow">
          <button class="rbtn wide" id="lineSolid" title="Solid Line">── Solid</button>
          <button class="rbtn wide" id="lineDashed" title="Dashed Line">┄┄ Dashed</button>
          <button class="rbtn wide" id="lineDotted" title="Dotted Line">···· Dotted</button>
          <button class="rbtn wide" id="lineDouble" title="Double Line">══ Double</button>
          <button class="rbtn wide" id="lineArrow" title="Arrow">➔ Arrow</button>
        </div>
      </div>
    </div>

    <!-- DESIGN TAB -->
    <div class="ribbon-panel" id="panel-design">
      <div class="rgroup">
        <div class="rlabel">Template (logo included on every layout)</div>
        <div class="rrow" id="templateThumbs" style="gap:10px;"></div>
      </div>
      <div class="rdiv"></div>
      <div class="rgroup">
        <div class="rlabel">Canvas</div>
        <div class="rrow">
          <div class="swatch-btn" title="Brand background — fixed">
            <span class="swatch-bar" style="background:#FEF8F3;border:1px solid #ddd;"></span>
            <span style="font-size:9px;color:#888;">#FEF8F3</span>
          </div>
          <button class="rbtn wide" id="btnReset" title="Clear all your content">🗑 Reset</button>
        </div>
      </div>
    </div>

  {id:'classic',name:'Classic Frame',fn:tplClassic},

];

/* ============ STATE ============ */
let logoURL = (LOGO_URL && LOGO_URL.trim()) ? LOGO_URL.trim() : DEFAULT_LOGO_B64;
let currentTemplate = localStorage.getItem('ff_template') || 'classic';
let currentZoom = 1;
let selectedEl = null;
let zCounter = 10;
let activeEditable = null;
let activeCell = null;

const stage=document.getElementById('stage');
const stageScaler=document.getElementById('stageScaler');
const stageViewport=document.getElementById('stageViewport');
const chromeLayer=document.getElementById('chromeLayer');
const contentLayer=document.getElementById('contentLayer');
const emptyHint=document.getElementById('emptyHint');
const floatToolbar=document.getElementById('floatToolbar');

/* ============ INIT ============ */
function renderChrome(){
  const t = TEMPLATES.find(t=>t.id===currentTemplate) || TEMPLATES[0];
  chromeLayer.innerHTML = t.fn(logoURL);
}
function renderThumbs(){
  const wrap=document.getElementById('templateThumbs');
  wrap.innerHTML='';
  TEMPLATES.forEach(t=>{
    const card=document.createElement('div');
    card.className='tmpl-card';
    const thumb=document.createElement('div');
    thumb.className='tmpl-thumb'+(t.id===currentTemplate?' active':'');
    thumb.dataset.id=t.id;
    const mini=document.createElement('div');
    mini.className='mini-stage';
    mini.style.background=CREAM;
    mini.innerHTML=t.fn(logoURL);
    thumb.appendChild(mini);
    thumb.addEventListener('click',()=>{
      currentTemplate=t.id;
      localStorage.setItem('ff_template',t.id);
      renderChrome();
      renderThumbs();
    });
    const label=document.createElement('span');
    label.textContent=t.name;
    card.appendChild(thumb);card.appendChild(label);
    wrap.appendChild(card);
  });
}
function fitZoom(){
  const availW = stageViewport.clientWidth-60;
  const availH = stageViewport.clientHeight-60;
  currentZoom = Math.max(0.2, Math.min(1, availW/1080, availH/1080));
  applyZoom();
}
function applyZoom(){
  stageScaler.style.transform=`scale(${currentZoom})`;
  stageScaler.style.width=1080*currentZoom+'px';
  stageScaler.style.height=1080*currentZoom+'px';
  document.getElementById('zoomLabel').textContent=Math.round(currentZoom*100)+'%';
}
document.getElementById('zoomIn').onclick=()=>{currentZoom=Math.min(2,currentZoom+0.1);applyZoom();};
document.getElementById('zoomOut').onclick=()=>{currentZoom=Math.max(0.2,currentZoom-0.1);applyZoom();};
window.addEventListener('resize',fitZoom);
/* Ctrl/Cmd + scroll wheel zooms the canvas; a plain scroll just scrolls the canvas viewport (not the page) */
stageViewport.addEventListener('wheel',(e)=>{
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    const step = e.deltaY > 0 ? -0.08 : 0.08;
    currentZoom = Math.min(2, Math.max(0.2, currentZoom + step));
    applyZoom();
  }
}, {passive:false});

function updateEmptyHint(){
  emptyHint.style.display = contentLayer.children.length ? 'none':'block';
}

/* ============ COORDINATE HELPERS ============ */
function toStage(clientX,clientY){
  const r = stage.getBoundingClientRect();
  return {x:(clientX-r.left)/currentZoom, y:(clientY-r.top)/currentZoom};
}

/* ============ RIBBON TABS ============ */
document.querySelectorAll('.ribbon-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.ribbon-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.ribbon-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    requestAnimationFrame(fitZoom);
  });
});
/* keep contenteditable selection alive when clicking ribbon buttons */
document.getElementById('ribbon').addEventListener('mousedown',(e)=>{
  if(e.target.tagName==='BUTTON' || e.target.closest('button')){ e.preventDefault(); }
});

/* ============ ELEMENT FACTORY ============ */
function baseElShell(type,left,top,width,height){
  const el=document.createElement('div');
  el.className='el el-'+type;
  el.dataset.type=type;
  el.dataset.angle='0';
  el.style.left=left+'px';el.style.top=top+'px';
  el.style.width=width+'px';el.style.height=height+'px';
  el.style.zIndex=++zCounter;
  el.style.transform='rotate(0deg)';
  return el;
}
function addHandles(el){
  ['nw','ne','sw','se','n','s','e','w'].forEach(pos=>{
    const h=document.createElement('div');h.className='handle h-'+pos;h.dataset.pos=pos;
    el.appendChild(h);
  });
  const rot=document.createElement('div');rot.className='rotate-handle';el.appendChild(rot);
  const del=document.createElement('button');del.className='del-btn';del.innerHTML='×';el.appendChild(del);
}

function addTextElement(){
  const el=baseElShell('text',340,470,400,90);
  const content=document.createElement('div');
  content.className='el-content';
  content.contentEditable='true';
  content.innerText='Add your text';
  content.style.fontFamily="'Poppins',sans-serif";
  content.style.fontWeight='700';
  content.style.fontSize='36px';
  content.style.color=NAVY;
  content.style.textAlign='center';
  el.insertBefore(content,el.firstChild);
  addHandles(el);
  contentLayer.appendChild(el);
  wireText(el);
  selectElement(el);
  updateEmptyHint();
  return el;
}

function addImageElement(src,naturalW,naturalH){
  let w=360,h=360;
  if(naturalW && naturalH){ const ratio=naturalW/naturalH; if(ratio>1){h=w/ratio;} else {w=h*ratio;} }
  const el=baseElShell('image',(1080-w)/2,(1080-h)/2,w,h);
  el.dataset.ratio = (naturalW&&naturalH)? (naturalW/naturalH) : (w/h);
  const img=document.createElement('img');
  img.src=src;
  el.insertBefore(img,el.firstChild);
  addHandles(el);
  contentLayer.appendChild(el);
  wireGeneric(el);
  selectElement(el);
  updateEmptyHint();
  return el;
}

function addShapeElement(kind){
  let w=200,h=140;
  if(kind==='circle'){w=180;h=180;}
  if(kind==='pill'){w=240;h=76;}
  if(kind==='star'){w=160;h=160;}
  if(kind==='triangle'){w=180;h=160;}
  if(kind==='diamond'){w=170;h=170;}
  if(kind==='hexagon'){w=190;h=160;}
  if(kind==='arrow'){w=210;h=120;}
  if(kind==='speech'){w=210;h=160;}
  const el=baseElShell('shape',(1080-w)/2,(1080-h)/2,w,h);
  el.dataset.shape=kind;
  el.dataset.fill=GOLD;
  const content=document.createElement('div');
  content.className='el-content';
  renderShapeContent(content,kind,GOLD);
  el.insertBefore(content,el.firstChild);
  addHandles(el);
  contentLayer.appendChild(el);
  wireGeneric(el);
  selectElement(el);
  updateEmptyHint();
  return el;
}
function renderShapeContent(content,kind,fill){
  content.style.background='none';content.style.borderRadius='0';content.innerHTML='';
  if(kind==='rect'){ content.style.background=fill; content.style.borderRadius='14px'; }
  else if(kind==='circle'){ content.style.background=fill; content.style.borderRadius='50%'; }
  else if(kind==='pill'){ content.style.background=fill; content.style.borderRadius='999px'; }
  else if(kind==='star'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <polygon points="50,4 61,37 96,37 68,58 79,92 50,71 21,92 32,58 4,37 39,37" fill="${fill}"/></svg>`;
  }
  else if(kind==='triangle'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <polygon points="50,5 96,95 4,95" fill="${fill}"/></svg>`;
  }
  else if(kind==='diamond'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <polygon points="50,3 97,50 50,97 3,50" fill="${fill}"/></svg>`;
  }
  else if(kind==='hexagon'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <polygon points="25,4 75,4 100,50 75,96 25,96 0,50" fill="${fill}"/></svg>`;
  }
  else if(kind==='arrow'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <polygon points="0,28 55,28 55,6 98,50 55,94 55,72 0,72" fill="${fill}"/></svg>`;
  }
  else if(kind==='speech'){
    content.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
      <path d="M5 8 h90 a5 5 0 0 1 5 5 v52 a5 5 0 0 1 -5 5 h-53 l-22 22 v-22 h-15 a5 5 0 0 1 -5 -5 v-52 a5 5 0 0 1 5 -5 z" fill="${fill}"/></svg>`;
  }
}

  const el=baseElShell('line',260,540,400,30);
  el.dataset.linestyle=style;
  el.dataset.color=NAVY;
  el.dataset.thickness='5';

function renderLineContent(el){
  const content=el.querySelector('.el-content');
  const color=el.dataset.color, thick=el.dataset.thickness, style=el.dataset.linestyle;
  if(style==='arrow'){
    content.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 400 30" preserveAspectRatio="none" style="overflow:visible;">
      <line x1="5" y1="15" x2="380" y2="15" stroke="${color}" stroke-width="${thick}"/>
      <path d="M370 4 L392 15 L370 26 Z" fill="${color}"/>
    </svg>`;
  } else {
    const border = style==='double' ? `${thick}px double ${color}` : `${thick}px ${style} ${color}`;
    content.innerHTML=`<div style="width:100%;border-top:${border};"></div>`;
  }
}

function addTableElement(rows,cols){
  const w=520,h=Math.max(140,rows*46+16);
  const el=baseElShell('table',(1080-w)/2,(1080-h)/2,w,h);
  const wrap=document.createElement('div');
  wrap.className='table-wrap el-content';
  const grip=document.createElement('div');
  grip.className='table-drag';
  grip.innerHTML='<span class="dotgrip"></span><span class="dotgrip"></span><span class="dotgrip"></span>';
  const table=document.createElement('table');
  for(let r=0;r<rows;r++){
    const tr=document.createElement('tr');
    if(r===0) tr.className='hdr';
    for(let c=0;c<cols;c++){

      td.contentEditable='true';
      td.innerText = r===0 ? 'Header '+(c+1) : '';
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  wrap.appendChild(grip);wrap.appendChild(table);
  el.insertBefore(wrap,el.firstChild);
  addHandles(el);
  contentLayer.appendChild(el);
  wireTable(el,grip);
  selectElement(el);
  updateEmptyHint();
  return el;
}

/* ============ WIRING (drag / resize / rotate / select) ============ */
function wireGeneric(el){
  el.addEventListener('pointerdown',(e)=>{
    if(e.target.classList.contains('handle')||e.target.classList.contains('rotate-handle')||e.target.classList.contains('del-btn')) return;
    e.stopPropagation();
    selectElement(el);
    startDrag(el,e);
  });
  wireHandles(el);
}
function wireText(el){
  el.addEventListener('pointerdown',(e)=>{
    if(e.target.classList.contains('handle')||e.target.classList.contains('rotate-handle')||e.target.classList.contains('del-btn')) return;
    e.stopPropagation();
    selectElement(el);
    if(!el.classList.contains('editing')){
      e.preventDefault();
      startDrag(el,e);
    }
  });
  const content=el.querySelector('.el-content');
  content.addEventListener('dblclick',(e)=>{
    e.stopPropagation();
    el.classList.add('editing');
    content.focus();
    placeCaretAtEnd(content);
  });
  content.addEventListener('focus',()=>{ activeEditable=content; el.classList.add('editing'); });
  content.addEventListener('blur',()=>{ el.classList.remove('editing'); if(activeEditable===content) activeEditable=null; });
  wireHandles(el);
}
function wireTable(el,grip){
  grip.addEventListener('pointerdown',(e)=>{
    e.stopPropagation();
    activeCell=null;
    selectElement(el);
    startDrag(el,e);
  });
  el.addEventListener('pointerdown',(e)=>{
    if(e.target.classList.contains('handle')||e.target.classList.contains('rotate-handle')||e.target.classList.contains('del-btn')) return;
    e.stopPropagation();
    const td=e.target.closest('td');
    activeCell = (td && el.contains(td)) ? td : null;
    selectElement(el);
  });
  wireHandles(el);
}
function placeCaretAtEnd(node){
  const range=document.createRange();range.selectNodeContents(node);range.collapse(false);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
}

function startDrag(el,e){
  const start=toStage(e.clientX,e.clientY);
  const startLeft=parseFloat(el.style.left), startTop=parseFloat(el.style.top);
  function move(ev){
    const cur=toStage(ev.clientX,ev.clientY);
    const dx=cur.x-start.x, dy=cur.y-start.y;
    let nl=startLeft+dx, nt=startTop+dy;
    nl=Math.max(-el.offsetWidth*0.6,Math.min(1080-el.offsetWidth*0.4,nl));
    nt=Math.max(-el.offsetHeight*0.6,Math.min(1080-el.offsetHeight*0.4,nt));
    el.style.left=nl+'px'; el.style.top=nt+'px';
    updateFloatingToolbarPos();
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
}

function wireHandles(el){
  el.querySelectorAll('.handle').forEach(h=>{
    h.addEventListener('pointerdown',(e)=>{
      e.stopPropagation();e.preventDefault();
      selectElement(el);
      startResize(el,h.dataset.pos,e);
    });
  });
  const rot=el.querySelector('.rotate-handle');
  rot.addEventListener('pointerdown',(e)=>{
    e.stopPropagation();e.preventDefault();
    selectElement(el);
    startRotate(el,e);
  });
  const del=el.querySelector('.del-btn');
  del.addEventListener('click',(e)=>{
    e.stopPropagation();
    deleteElement(el);
  });
}

function startResize(el,pos,e){
  const w0=parseFloat(el.style.width), h0=parseFloat(el.style.height);
  const l0=parseFloat(el.style.left), t0=parseFloat(el.style.top);
  const cx=l0+w0/2, cy=t0+h0/2;
  const angle=(parseFloat(el.dataset.angle)||0)*Math.PI/180;
  const lockAspect = el.dataset.type==='image' && ['nw','ne','sw','se'].includes(pos);
  const ratio = el.dataset.ratio ? parseFloat(el.dataset.ratio) : (w0/h0);
  function move(ev){
    const pt=toStage(ev.clientX,ev.clientY);
    const vx=pt.x-cx, vy=pt.y-cy;
    const cos=Math.cos(-angle), sin=Math.sin(-angle);
    const lx=vx*cos-vy*sin, ly=vx*sin+vy*cos;
    let newW=w0, newH=h0;
    if(['nw','ne','sw','se'].includes(pos)){
      newW=Math.max(24,Math.abs(lx)*2);
      newH=lockAspect ? Math.max(24,newW/ratio) : Math.max(24,Math.abs(ly)*2);
    } else if(pos==='e'||pos==='w'){
      newW=Math.max(24,Math.abs(lx)*2); newH=h0;
    } else if(pos==='n'||pos==='s'){
      newH=Math.max(24,Math.abs(ly)*2); newW=w0;
    }
    el.style.width=newW+'px'; el.style.height=newH+'px';
    el.style.left=(cx-newW/2)+'px'; el.style.top=(cy-newH/2)+'px';
    if(el.dataset.type==='line') renderLineContent(el);
    updateFloatingToolbarPos();
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
}

function startRotate(el,e){
  function move(ev){
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    let angle=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI + 90;
    el.dataset.angle=angle;
    el.style.transform=`rotate(${angle}deg)`;
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
}

function deleteElement(el){
  if(selectedEl===el){ selectedEl=null; floatToolbar.style.display='none'; }
  if(activeCell && el.contains(activeCell)) activeCell=null;
  el.remove();
  updateEmptyHint();
}

/* ============ SELECTION ============ */
function selectElement(el){
  if(selectedEl && selectedEl!==el) selectedEl.classList.remove('selected');
  if(el.dataset.type!=='table') activeCell=null;
  selectedEl=el;
  el.classList.add('selected');
  buildFloatingToolbar(el);
  updateFloatingToolbarPos();
}
function deselectAll(){
  if(selectedEl){ selectedEl.classList.remove('selected'); selectedEl.classList.remove('editing'); }
  selectedEl=null;
  activeCell=null;
  floatToolbar.style.display='none';
}
stage.addEventListener('pointerdown',(e)=>{
  if(e.target.id==='stage'||e.target.id==='contentLayer'||e.target.id==='emptyHint'||e.target.id==='chromeLayer'){
    deselectAll();
  }
});

function updateFloatingToolbarPos(){
  if(!selectedEl){floatToolbar.style.display='none';return;}
  const elRect=selectedEl.getBoundingClientRect();
  const headerRibbonBottom = document.getElementById('ribbon').getBoundingClientRect().bottom;
  let top = elRect.top - 46;
  let left = elRect.left;
  if(top < headerRibbonBottom + 4) top = elRect.bottom + 8;
  floatToolbar.style.display='flex';
  const ftW = floatToolbar.offsetWidth || 160;
  const ftH = floatToolbar.offsetHeight || 36;
  if(left + ftW > window.innerWidth - 4) left = window.innerWidth - ftW - 4;
  if(left < 4) left = 4;
  if(top + ftH > window.innerHeight - 4) top = window.innerHeight - ftH - 4;
  if(top < 4) top = 4;
  floatToolbar.style.top=Math.round(top)+'px';
  floatToolbar.style.left=Math.round(left)+'px';
}

/* ============ FLOATING TOOLBAR CONTENT ============ */
function buildFloatingToolbar(el){
  floatToolbar.innerHTML='';
  const type=el.dataset.type;
  addFtBtn('⧉','Duplicate',()=>duplicateElement(el));
  addFtBtn('⬆','Bring to Front',()=>{el.style.zIndex=++zCounter;});
  addFtBtn('⬇','Send Backward',()=>{el.style.zIndex=Math.max(1,(parseInt(el.style.zIndex)||1)-2);});
  addFtDiv();

  if(type==='shape'){
    addFtColorSwatch(el.dataset.fill,(color)=>{
      el.dataset.fill=color;
      renderShapeContent(el.querySelector('.el-content'),el.dataset.shape,color);
    });
  }
  if(type==='line'){
    const sel=document.createElement('select');
    ['solid','dashed','dotted','double','arrow'].forEach(s=>{
      const o=document.createElement('option');o.value=s;o.textContent=s[0].toUpperCase()+s.slice(1);
      if(el.dataset.linestyle===s)o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=()=>{el.dataset.linestyle=sel.value;renderLineContent(el);};
    floatToolbar.appendChild(sel);
    addFtColorSwatch(el.dataset.color,(color)=>{el.dataset.color=color;renderLineContent(el);});
    addFtBtn('▬+','Thicker',()=>{el.dataset.thickness=Math.min(20,parseInt(el.dataset.thickness)+1);renderLineContent(el);});
    addFtBtn('▬−','Thinner',()=>{el.dataset.thickness=Math.max(1,parseInt(el.dataset.thickness)-1);renderLineContent(el);});
  }
  if(type==='image'){
    addFtBtn('⇄','Replace Image',()=>{
      pendingReplaceEl=el;
      document.getElementById('imageFileInput').click();
    });
    addFtBtn('▢','Round Corners',()=>{
      const img=el.querySelector('img');
      const cur=parseInt(img.style.borderRadius)||0;
      img.style.borderRadius = (cur>0? 0 : 24)+'px';
    });
  }
  if(type==='table'){
    addFtBtn('+R','Add Row',()=>tableAddRow(el));
    addFtBtn('−R','Remove Row',()=>tableRemoveRow(el));
    addFtBtn('+C','Add Column',()=>tableAddCol(el));
    addFtBtn('−C','Remove Column',()=>tableRemoveCol(el));
    addFtDiv();
    addFtSwatchLabeled('Header',NAVY,(color)=>tableSetHeaderColor(el,color));
    addFtSwatchLabeled('Border',NAVY,(color)=>tableSetBorderColor(el,color));
    if(activeCell && el.contains(activeCell)){
      addFtDiv();
      addFtSwatchLabeled('Cell',GOLD,(color)=>{ activeCell.style.background=color; activeCell.style.color=isLightColor(color)?NAVY:'#fff'; });
      addFtSwatchLabeled('Row',GOLD,(color)=>{
        Array.from(activeCell.parentElement.children).forEach(td=>{ td.style.background=color; td.style.color=isLightColor(color)?NAVY:'#fff'; });
      });
      addFtSwatchLabeled('Column',GOLD,(color)=>{
        const table=el.querySelector('table');
        const idx=Array.from(activeCell.parentElement.children).indexOf(activeCell);
        Array.from(table.rows).forEach(row=>{ if(row.cells[idx]){ row.cells[idx].style.background=color; row.cells[idx].style.color=isLightColor(color)?NAVY:'#fff'; } });
      });
    }
  }

  addFtDiv();
  addFtBtn('🗑','Delete',()=>deleteElement(el));
}
function addFtBtn(label,title,fn){
  const b=document.createElement('button');b.innerHTML=label;b.title=title;
  b.onmousedown=(e)=>e.preventDefault();
  b.onclick=fn;
  floatToolbar.appendChild(b);
}
function addFtDiv(){ const d=document.createElement('div');d.className='ft-div';floatToolbar.appendChild(d); }
function addFtColorSwatch(current,onPick){
  const wrap=document.createElement('div');wrap.style.position='relative';
  const b=document.createElement('button');
  b.style.background=current;b.style.width='22px';b.style.height='22px';b.style.borderRadius='5px';b.style.border='2px solid #fff';
  b.onmousedown=(e)=>e.preventDefault();
  b.onclick=(e)=>{ e.stopPropagation(); openPalette(wrap,(color)=>{ b.style.background=color; onPick(color); }); };
  wrap.appendChild(b);
  floatToolbar.appendChild(wrap);
}
function addFtSwatchLabeled(text,current,onPick){
  const wrap=document.createElement('div');wrap.style.position='relative';
  const b=document.createElement('button');
  b.style.cssText='display:flex;align-items:center;gap:5px;padding:0 8px;height:28px;width:auto;border-radius:6px;background:transparent;border:none;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;';
  const dot=document.createElement('span');
  dot.style.cssText=`width:13px;height:13px;border-radius:4px;background:${current};border:1px solid #ffffff66;display:inline-block;flex:0 0 auto;`;
  b.appendChild(dot); b.appendChild(document.createTextNode(text));
  b.onmousedown=(e)=>e.preventDefault();
  b.onclick=(e)=>{ e.stopPropagation(); openPalette(wrap,(color)=>{ dot.style.background=color; onPick(color); }); };
  wrap.appendChild(b);
  floatToolbar.appendChild(wrap);
}
function isLightColor(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return (r*299+g*587+b*114)/1000 > 150;
}

function duplicateElement(el){
  const clone=el.cloneNode(true);
  clone.classList.remove('selected','editing');
  clone.style.left=(parseFloat(el.style.left)+24)+'px';
  clone.style.top=(parseFloat(el.style.top)+24)+'px';
  clone.style.zIndex=++zCounter;
  contentLayer.appendChild(clone);
  const type=el.dataset.type;
  if(type==='text') wireText(clone);
  else if(type==='table') wireTable(clone,clone.querySelector('.table-drag'));
  else wireGeneric(clone);
  selectElement(clone);
}

/* ============ TABLE HELPERS ============ */
function tableAddRow(el){
  const table=el.querySelector('table');
  const cols=table.rows[0].cells.length;
  const tr=document.createElement('tr');
  for(let c=0;c<cols;c++){const td=document.createElement('td');td.contentEditable='true';tr.appendChild(td);}
  table.appendChild(tr);
  el.style.height=(parseFloat(el.style.height)+46)+'px';
}
function tableRemoveRow(el){
  const table=el.querySelector('table');
  if(table.rows.length>1){ table.deleteRow(table.rows.length-1); el.style.height=(parseFloat(el.style.height)-46)+'px'; }
}
function tableAddCol(el){
  const table=el.querySelector('table');
  for(const row of table.rows){const td=document.createElement('td');td.contentEditable='true';row.appendChild(td);}
}
function tableRemoveCol(el){
  const table=el.querySelector('table');
  if(table.rows[0].cells.length>1){ for(const row of table.rows){row.deleteCell(row.cells.length-1);} }
}
function tableSetHeaderColor(el,color){
  const hdr=el.querySelector('table tr.hdr');
  if(!hdr) return;
  const textColor = isLightColor(color) ? NAVY : '#fff';
  Array.from(hdr.children).forEach(td=>{ td.style.background=color; td.style.color=textColor; });
}
function tableSetBorderColor(el,color){

}

/* ============ PALETTE POPOVER BUILDER ============ */
let openPopoverEl=null;
function openPalette(anchor,onPick){
  closePalette();
  const pop=document.createElement('div');
  pop.className='popover';
  const brandLabel=document.createElement('div');brandLabel.className='plabel';brandLabel.textContent='Brand Colors';
  pop.appendChild(brandLabel);
  const brandGrid=document.createElement('div');brandGrid.className='swatch-grid';
  BRAND_SWATCHES.forEach(s=>{
    const sw=document.createElement('div');sw.className='swatch';sw.style.background=s.hex;sw.title=s.name;
    if(s.hex==='#FFFFFF') sw.style.border='1px solid #ccc';
    sw.onclick=()=>{onPick(s.hex);closePalette();};
    brandGrid.appendChild(sw);
  });
  pop.appendChild(brandGrid);
  const stdLabel=document.createElement('div');stdLabel.className='plabel';stdLabel.textContent='Standard Colors';
  pop.appendChild(stdLabel);
  const stdGrid=document.createElement('div');stdGrid.className='swatch-grid';
  STANDARD_SWATCHES.forEach(hex=>{
    const sw=document.createElement('div');sw.className='swatch';sw.style.background=hex;
    sw.onclick=()=>{onPick(hex);closePalette();};
    stdGrid.appendChild(sw);
  });
  pop.appendChild(stdGrid);
  const customRow=document.createElement('div');customRow.className='custom-row';
  const inp=document.createElement('input');inp.type='color';inp.value='#031E36';
  inp.oninput=()=>{onPick(inp.value);};
  const span=document.createElement('span');span.textContent='Custom color…';
  customRow.appendChild(inp);customRow.appendChild(span);
  pop.appendChild(customRow);

  /* Render fixed to the viewport and appended to <body> so it can never be
     clipped by an ancestor's overflow, and always paints above the canvas. */
  pop.style.position='fixed';
  pop.style.zIndex='1000';
  pop.style.visibility='hidden';
  document.body.appendChild(pop);
  const rect=anchor.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=rect.left, top=rect.bottom+6;
  if(left+pw>window.innerWidth-8) left=window.innerWidth-pw-8;
  if(left<8) left=8;
  if(top+ph>window.innerHeight-8) top=rect.top-ph-6;
  if(top<8) top=8;
  pop.style.left=Math.round(left)+'px';
  pop.style.top=Math.round(top)+'px';
  pop.style.visibility='visible';
  openPopoverEl=pop;
  setTimeout(()=>document.addEventListener('pointerdown',outsidePaletteClick),0);
}
function outsidePaletteClick(e){
  if(openPopoverEl && !openPopoverEl.contains(e.target)) closePalette();
}
function closePalette(){
  if(openPopoverEl){ openPopoverEl.remove(); openPopoverEl=null; }
  document.removeEventListener('pointerdown',outsidePaletteClick);
}

};

/* ============ DESIGN TAB ============ */
document.getElementById('btnReset').onclick=()=>{
  if(confirm('Remove everything you\'ve added to the canvas?')){
    contentLayer.innerHTML='';
    deselectAll();
    updateEmptyHint();
  }
};

/* ============ DOWNLOAD ============ */
document.getElementById('downloadBtn').onclick=async()=>{
  deselectAll();
  document.getElementById('exportOverlay').classList.add('show');
  const prevTransform=stageScaler.style.transform;
  const prevW=stageScaler.style.width, prevH=stageScaler.style.height;
  stage.classList.add('exporting');
  stageScaler.style.transform='none';
  stageScaler.style.width='1080px';stageScaler.style.height='1080px';
  await new Promise(r=>setTimeout(r,60));
  try{
    const canvas = await html2canvas(stage,{scale:3,backgroundColor:'#FEF8F3',useCORS:true,allowTaint:true});
    const link=document.createElement('a');
    link.download='fresher-fiascos-post.png';
    link.href=canvas.toDataURL('image/png',1.0);
    link.click();
  }catch(err){
    alert('Export failed: '+err.message+'\\nIf you set a custom logo URL, make sure it allows cross-origin image access.');
  }
  stage.classList.remove('exporting');
  stageScaler.style.transform=prevTransform;
  stageScaler.style.width=prevW;stageScaler.style.height=prevH;
  document.getElementById('exportOverlay').classList.remove('show');
};

/* ============ KEYBOARD SHORTCUTS ============ */
document.addEventListener('keydown',(e)=>{
  if(!selectedEl) return;
  const ae=document.activeElement;
  const activeIsEditable = ae && (ae.isContentEditable || ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
  if((e.key==='Delete'||e.key==='Backspace') && !activeIsEditable){
    e.preventDefault(); deleteElement(selectedEl);
  }
  if((e.metaKey||e.ctrlKey) && e.key==='d' && !activeIsEditable){
    e.preventDefault(); duplicateElement(selectedEl);
  }
  if(!activeIsEditable && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const step=e.shiftKey?10:1;
    let l=parseFloat(selectedEl.style.left), t=parseFloat(selectedEl.style.top);
    if(e.key==='ArrowUp')t-=step; if(e.key==='ArrowDown')t+=step;
    if(e.key==='ArrowLeft')l-=step; if(e.key==='ArrowRight')l+=step;
    selectedEl.style.left=l+'px'; selectedEl.style.top=t+'px';
    updateFloatingToolbarPos();
  }
});

/* ============ BOOT ============ */
renderChrome();
renderThumbs();
fitZoom();
updateEmptyHint();
document.getElementById('headerIcon').src = (HEADER_ICON_URL && HEADER_ICON_URL.trim()) ? HEADER_ICON_URL.trim() : DEFAULT_LOGO_B64;
</script>
</body>
